name: Verify
on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      matrix:
        node: ['24.22.3', '26.13.1']
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install session test dependency
        run: sudo apt-get update -qq && sudo apt-get install -y redis-server
      - run: npm ci
      - run: npm run verify
      - run: npm audit --omit=dev --audit-level=moderate
      - run: node scripts/stage-runtime.mjs
      - run: node scripts/check-private.mjs --artifact artifacts/runtime
  standalone:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.22.3'
          cache: npm
      - run: npm ci
      - run: npm run init
      - run: docker compose up --build --wait
      - run: docker compose exec -T -e CINDERTRACE_DEMO_CONFIRM=isolated-synthetic-installation api node scripts/demo.mjs --preserve
      - run: docker compose exec -T postgres createdb -U cindertrace cindertrace_test_core_ci
      - run: >-
          docker compose exec -T api node -e
          'process.env.CINDERTRACE_TEST_DATABASE_URL=process.env.DATABASE_URL.replace(/\/[^/]+$/,"/cindertrace_test_core_ci");import("./scripts/core-integration.mjs")'
      - run: docker compose exec -T -e CINDERTRACE_RECOVERY_TEST_CONFIRM=disposable-installation api node scripts/recovery-integration.mjs
      - run: npm run test:upgrade
      - name: Stop disposable installation
        if: always()
        run: docker compose down

  browser-auth:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      redis:
        image: redis:8.10.3-alpine@sha256:21090af93f8324db2f0f0f4f38a7c60369d47d917e000c3423d89d2ae2883537
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-retries 20
    env:
      CINDERTRACE_AUTH_TEST_CONFIRM: isolated-synthetic-installation
      CINDERTRACE_TEST_REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.22.3'
          cache: npm
      - run: npm ci
      - run: npm run build -w @cindertrace/contracts -w @cindertrace/integrations -w @cindertrace/api
      - run: npm run test:browser-auth
      - name: Confirm the fixture removed its records
        run: test "$(docker exec "${{ job.services.redis.id }}" redis-cli dbsize)" = 0

  lab:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.22.3'
          cache: npm
      - run: npm ci
      - run: npm run init -- --lab
      - run: npm run lab -- up
      - run: docker compose exec -T postgres createdb -U cindertrace cindertrace_test_lab_ci
      - run: >-
          docker compose exec -T -e CINDERTRACE_LAB_RECOVERY_TEST=true api node -e
          'process.env.CINDERTRACE_TEST_DATABASE_URL=process.env.DATABASE_URL.replace(/\/[^/]+$/,"/cindertrace_test_lab_ci");import("./scripts/lab-integration.mjs")'
      - run: npx playwright install --with-deps chromium
      - run: CINDERTRACE_LAB_BROWSER_TEST_CONFIRM=disposable-installation npm run test:lab:browser
      - name: Stop disposable lab
        if: always()
        run: npm run lab -- stop
