name: cindertrace
x-app: &app
  build: .
  image: '${CINDERTRACE_IMAGE:-cindertrace:local}'
  user: '${CINDERTRACE_UID:-1000}:${CINDERTRACE_GID:-1000}'
  env_file: .env
  restart: unless-stopped
  volumes:
    - ./certs:/certs:ro
    - ./state:/state
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
services:
  postgres:
    image: postgres:18.6-bookworm@sha256:5c4783a8cc3f0074912164f94dfa1be4e043438f0f707cf968d7af9a0d31a2c8
    environment:
      POSTGRES_DB: '${CINDERTRACE_DATABASE_NAME:-cindertrace}'
      POSTGRES_USER: cindertrace
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run npm run init first}
    volumes: [postgres:/var/lib/postgresql]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U cindertrace -d cindertrace']
      interval: 5s
      retries: 20
  redis:
    image: redis:8.10.3-alpine@sha256:21090af93f8324db2f0f0f4f38a7c60369d47d917e000c3423d89d2ae2883537
    command: [redis-server, --appendonly, 'yes']
    volumes: [redis:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      retries: 20
  migrate:
    <<: *app
    restart: 'no'
    command: [npm, run, db:migrate]
    depends_on:
      postgres: {condition: service_healthy}
  api:
    <<: *app
    command: [node, services/security-fusion/dist/index.js]
    environment:
      # Browsers arrive through the gateway; its X-Forwarded-For names the client.
      CINDERTRACE_TRUSTED_PROXIES: '${CINDERTRACE_TRUSTED_PROXIES:-gateway}'
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    healthcheck:
      test: [CMD, node, -e, "fetch('https://localhost:4101/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      retries: 10
  # HiveXUI in local mode: Cindertrace pages only, signed in by the API's own local sign-in.
  # Static files only; it is reached through the gateway and has no published port.
  ui:
    # HiveXUI 0.12.0 (the digest Hive 3.14.3's signed suite manifest pins).
    image: '${CINDERTRACE_UI_IMAGE:-ghcr.io/cheftaco/hivexui@sha256:8407f94d12d9de5d844718f25f15b7728709380d932cc655466773becb338a99}'
    user: '101:101'
    restart: unless-stopped
    read_only: true
    tmpfs: ['/tmp:uid=101,gid=101,mode=700', '/var/run:uid=101,gid=101,mode=700']
    volumes:
      - ./ui/runtime.json:/usr/share/nginx/html/runtime.json:ro
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1:8080/health']
      interval: 10s
      retries: 10
  # The published origin (DASHBOARD_PUBLIC_ORIGIN): TLS, HiveXUI, and /api/cindertrace/* to
  # the API's /api/v1/*. It receives no product secrets.
  gateway:
    build: .
    image: '${CINDERTRACE_IMAGE:-cindertrace:local}'
    user: '${CINDERTRACE_UID:-1000}:${CINDERTRACE_GID:-1000}'
    restart: unless-stopped
    read_only: true
    command: [node, scripts/ui-gateway.mjs]
    environment:
      CINDERTRACE_GATEWAY_PORT: '3444'
      CINDERTRACE_API_URL: https://api:4101
      CINDERTRACE_UI_UPSTREAM: http://ui:8080
      TLS_CERT_PATH: /certs/server.crt
      TLS_KEY_PATH: /certs/server.key
      NODE_EXTRA_CA_CERTS: /certs/server.crt
    volumes:
      - ./certs:/certs:ro
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    ports: ['127.0.0.1:${CINDERTRACE_UI_PORT:-3444}:3444']
    depends_on:
      api: {condition: service_healthy}
      ui: {condition: service_healthy}
    healthcheck:
      test: [CMD, node, -e, "fetch('https://localhost:3444/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      retries: 10
  collector:
    <<: *app
    command: [node, services/security-collector/dist/index.js]
    profiles: [collector]
    depends_on:
      api: {condition: service_healthy}
volumes:
  postgres:
  redis:
