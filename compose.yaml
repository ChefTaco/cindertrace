name: cindertrace
x-app: &app
  build: .
  image: cindertrace:local
  user: '${CINDERTRACE_UID:-1000}:${CINDERTRACE_GID:-1000}'
  env_file: .env
  restart: unless-stopped
  volumes:
    - ./certs:/certs:ro
    - ./state:/state
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
services:
  postgres:
    image: postgres:18.6-bookworm@sha256:5c4783a8cc3f0074912164f94dfa1be4e043438f0f707cf968d7af9a0d31a2c8
    environment:
      POSTGRES_DB: cindertrace
      POSTGRES_USER: cindertrace
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run npm run init first}
    volumes: [postgres:/var/lib/postgresql]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U cindertrace -d cindertrace']
      interval: 5s
      retries: 20
  redis:
    image: redis:8.10.3-alpine@sha256:21090af93f8324db2f0f0f4f38a7c60369d47d917e000c3423d89d2ae2883537
    command: [redis-server, --appendonly, 'yes']
    volumes: [redis:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      retries: 20
  migrate:
    <<: *app
    restart: 'no'
    command: [npm, run, db:migrate]
    depends_on:
      postgres: {condition: service_healthy}
  api:
    <<: *app
    command: [node, services/security-fusion/dist/index.js]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    healthcheck:
      test: [CMD, node, -e, "fetch('https://localhost:4101/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      retries: 10
  console:
    <<: *app
    working_dir: /app/console/apps/security-console
    command: [node, server-tls.mjs]
    environment: {PORT: '3444', HOSTNAME: '0.0.0.0'}
    ports: ['127.0.0.1:3444:3444']
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: [CMD, node, -e, "fetch('https://localhost:3444/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      retries: 10
  collector:
    <<: *app
    command: [node, services/security-collector/dist/index.js]
    profiles: [collector]
    depends_on:
      api: {condition: service_healthy}
volumes:
  postgres:
  redis:
